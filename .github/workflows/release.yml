name: Release Plugin

on:
  push:
    branches:
      - main
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin directory under plugins/ (e.g. skills-manager)
        required: true
        type: choice
        options:
          - dsh-manager
          - external-agents
          - skills-manager
          - system-dashboard

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Ensure npm supports OIDC Trusted Publishing
        run: |
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"
          npm install -g npm@latest
          echo "Updated npm: $(npm -v)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Manage Changesets Version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect unpublished plugin versions
        id: pending
        if: steps.changesets.outputs.hasChangesets == 'false'
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=$(node scripts/release-targets.mjs --pending-json)
          echo "targets=${TARGETS}" >> "$GITHUB_OUTPUT"
          COUNT=$(node -e 'console.log(JSON.parse(process.argv[1]).length)' "${TARGETS}")
          echo "has_targets=$([ "${COUNT}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Pending release targets (${COUNT}): ${TARGETS}"

      - name: Verify, publish via npm OIDC, tag, and create GitHub Releases
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.pending.outputs.has_targets == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGETS_JSON: ${{ steps.pending.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-repo-hygiene.mjs
          node --test scripts/release-targets.test.mjs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ROOT_DIR=$(pwd)
          while IFS= read -r ROW <&3; do
            DIR_NAME=$(node -e 'console.log(JSON.parse(process.argv[1]).dirName)' "${ROW}")
            REL_DIR=$(node -e 'console.log(JSON.parse(process.argv[1]).relDir)' "${ROW}")
            PKG_NAME=$(node -e 'console.log(JSON.parse(process.argv[1]).name)' "${ROW}")
            VERSION=$(node -e 'console.log(JSON.parse(process.argv[1]).version)' "${ROW}")
            TAG=$(node -e 'console.log(JSON.parse(process.argv[1]).tag)' "${ROW}")
            HAS_TAG=$(node -e 'console.log(JSON.parse(process.argv[1]).hasTag)' "${ROW}")

            echo "::group::Releasing ${PKG_NAME}@${VERSION} (${TAG})"
            (
              cd "${ROOT_DIR}/${REL_DIR}"
              pnpm run test
              pnpm run build
              npm publish --provenance --access public
              TARBALL=$(npm pack --quiet)
              TARBALL_PATH="${ROOT_DIR}/${REL_DIR}/${TARBALL}"

              cd "${ROOT_DIR}"
              if [ "${HAS_TAG}" != "true" ]; then
                git tag "${TAG}"
                git push origin "refs/tags/${TAG}"
              fi

              NOTES_FILE="${ROOT_DIR}/release-notes-${DIR_NAME}.md"
              rm -f "${NOTES_FILE}"
              node scripts/release-targets.mjs --extract-notes "${REL_DIR}/CHANGELOG.md" "${VERSION}" "${NOTES_FILE}"

              TITLE="${PKG_NAME}@${VERSION}"
              if gh release view "${TAG}" >/dev/null 2>&1; then
                gh release upload "${TAG}" "${TARBALL_PATH}" --clobber
              elif [ -s "${NOTES_FILE}" ]; then
                gh release create "${TAG}" "${TARBALL_PATH}" --title "${TITLE}" --notes-file "${NOTES_FILE}"
              else
                gh release create "${TAG}" "${TARBALL_PATH}" --title "${TITLE}" --generate-notes
              fi
              rm -f "${TARBALL_PATH}" "${NOTES_FILE}"
            )
            echo "::endgroup::"
          done 3< <(node -e 'console.log(JSON.parse(process.argv[1]).map(t => JSON.stringify(t)).join("\n"))' "${TARGETS_JSON}")

  release-single:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Resolve target plugin
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${{ github.event_name == 'workflow_dispatch' && inputs.plugin || github.ref_name }}"
          TARGET=$(node scripts/release-targets.mjs --resolve-single "${INPUT}")
          echo "dir_name=$(node -e 'console.log(JSON.parse(process.argv[1]).dirName)' "${TARGET}")" >> "$GITHUB_OUTPUT"
          echo "pkg_dir=$(node -e 'console.log(JSON.parse(process.argv[1]).relDir)' "${TARGET}")" >> "$GITHUB_OUTPUT"
          echo "pkg_name=$(node -e 'console.log(JSON.parse(process.argv[1]).name)' "${TARGET}")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -e 'console.log(JSON.parse(process.argv[1]).version)' "${TARGET}")" >> "$GITHUB_OUTPUT"
          echo "tag=$(node -e 'console.log(JSON.parse(process.argv[1]).tag)' "${TARGET}")" >> "$GITHUB_OUTPUT"

      - name: Ensure npm supports OIDC Trusted Publishing
        run: |
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"
          npm install -g npm@latest
          echo "Updated npm: $(npm -v)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test, build, and publish via npm OIDC
        working-directory: ${{ steps.meta.outputs.pkg_dir }}
        run: |
          pnpm run test
          pnpm run build
          npm publish --provenance --access public

      - name: Pack tarball and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PKG_DIR="${{ steps.meta.outputs.pkg_dir }}"
          PKG_NAME="${{ steps.meta.outputs.pkg_name }}"
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"

          TARBALL=$(cd "${PKG_DIR}" && npm pack --quiet)
          TARBALL_PATH="${PKG_DIR}/${TARBALL}"
          NOTES_FILE="release-notes.md"
          rm -f "${NOTES_FILE}"
          node scripts/release-targets.mjs --extract-notes "${PKG_DIR}/CHANGELOG.md" "${VERSION}" "${NOTES_FILE}"

          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

          TITLE="${PKG_NAME}@${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${TARBALL_PATH}" --clobber
          elif [ -s "${NOTES_FILE}" ]; then
            gh release create "${TAG}" "${TARBALL_PATH}" --title "${TITLE}" --notes-file "${NOTES_FILE}"
          else
            gh release create "${TAG}" "${TARBALL_PATH}" --title "${TITLE}" --generate-notes
          fi
