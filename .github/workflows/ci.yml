name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository hygiene and release script tests
        run: |
          node scripts/check-repo-hygiene.mjs
          node --test scripts/release-targets.test.mjs

      - name: Test and build releaseable plugins
        run: |
          set -euo pipefail
          TARGETS_JSON=$(node scripts/release-targets.mjs --list-releaseable)
          node -e '
            const { execFileSync } = require("node:child_process");
            const targets = JSON.parse(process.argv[1]);
            for (const target of targets) {
              console.log(`=== Checking ${target.name} (${target.relDir}) ===`);
              execFileSync("pnpm", ["--filter", target.name, "run", "test"], { stdio: "inherit" });
              execFileSync("pnpm", ["--filter", target.name, "run", "build"], { stdio: "inherit" });
            }
          ' "${TARGETS_JSON}"

      # Published @deepseek-ai/dsh-* packages omit some sibling client type edges
      # (see AGENTS.md); ./check-plugins-against-harness.sh is the authoritative
      # typecheck gate before merging into test/main.
      - name: Standalone typecheck (informational)
        continue-on-error: true
        run: |
          TARGETS_JSON=$(node scripts/release-targets.mjs --list-releaseable)
          node -e '
            const { execFileSync } = require("node:child_process");
            const targets = JSON.parse(process.argv[1]);
            for (const target of targets) {
              console.log(`=== Typechecking ${target.name} ===`);
              execFileSync("pnpm", ["--filter", target.name, "run", "typecheck"], { stdio: "inherit" });
            }
          ' "${TARGETS_JSON}"
